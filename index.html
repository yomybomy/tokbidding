<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>톡톡 비딩</title>
<meta name="description" content="헷갈릴 때 바로 누르는 브리지 비딩 카드">
<meta name="theme-color" content="#fffdf5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="톡톡 비딩">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* 기본 리셋 (이전 Claude 뷰어가 넣어 주던 것) */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
@supports (overflow: clip) { html { overflow-x: clip; } }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: sticker cards on a score-pad sheet; card grid left, hand finder right (tabs on phones) */
:root {
  --paper: #fffdf5;
  --sheet-line: rgba(38, 52, 120, .07);
  --ink: #232f6b;
  --muted: #5d6590;
  --card: #ffffff;
  --hl: #ffd84a;
  --hl-soft: #fff3c4;
  --on-hl: #232f6b;
  --red: #dc343b;
  --x-bg: #dc343b;
  --x-fg: #ffffff;
  --row: #f4f5fb;
  --f-display: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --f-suit: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols 2", sans-serif;
  /* 밝은 점수표 한 가지 테마로 고정: 기기 다크 모드여도 밝게 보여요 */
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent calc(50% - 1px), var(--sheet-line) calc(50% - 1px), var(--sheet-line) calc(50% + 1px), transparent calc(50% + 1px)),
    repeating-linear-gradient(180deg, transparent 0 31px, var(--sheet-line) 31px 32px);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
}
.r { color: var(--red); }
.s { font-family: var(--f-suit); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--hl); outline-offset: 3px; }

.wrap {
  grid-template-columns: minmax(0, 1fr);
  max-width: 1180px; margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px;
}
header { display: grid; gap: 14px; }
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 400;
  font-size: clamp(32px, 6vw, 48px); line-height: 1.1; text-wrap: balance;
}
.title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.stamp {
  font-family: var(--f-display); font-size: 15px; line-height: 1;
  background: var(--hl); color: var(--on-hl);
  border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 12px;
  box-shadow: 3px 3px 0 var(--ink); transform: rotate(-4deg);
}
.sign { margin: 0; text-align: center; font-family: var(--f-display); font-size: 15px; color: var(--muted); }
.hl {
  background: linear-gradient(transparent 55%, var(--hl) 55%, var(--hl) 92%, transparent 92%);
  padding: 0 4px;
}
.sub { margin: 0; color: var(--muted); }

.search {
  display: flex; align-items: center; gap: 10px; max-width: 560px;
  background: var(--card); border: 3px solid var(--ink); border-radius: 999px;
  box-shadow: 4px 4px 0 var(--ink); padding: 8px 18px;
}
.search input {
  flex: 1; min-width: 0; width: 100%; border: 0; background: none; outline: none;
  font: inherit; font-size: 16px; color: var(--ink);
}
.search:focus-within { box-shadow: 4px 4px 0 var(--hl), 4px 4px 0 3px var(--ink); }

.pills { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pills .lab { font-family: var(--f-display); font-size: 14px; color: var(--muted); margin-right: 2px; }
.pill {
  border: 2.5px solid var(--ink); background: var(--card); border-radius: 999px;
  padding: 4px 14px; cursor: pointer; font-family: var(--f-display); font-size: 15px;
  box-shadow: 2px 2px 0 var(--ink);
}
.pill[aria-pressed="true"] { background: var(--hl); color: var(--on-hl); }
.pill:active { transform: translate(2px, 2px); box-shadow: none; }

.tabs { display: none; gap: 8px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }

.tier-sec { display: grid; gap: 22px; }
.tier-sec + .tier-sec { margin-top: 44px; padding-top: 28px; border-top: 3px dashed var(--muted); }
.tier-head { display: grid; gap: 2px; }
.tier-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.2; }
.tier-head p { margin: 0; font-size: 14px; color: var(--muted); }
.group { display: grid; gap: 12px; }
.group h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.group h3 small { font-family: var(--f-body); font-size: 13px; color: var(--muted); margin-left: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 14px; }

.bid {
  position: relative;
  display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: center;
  min-height: 116px; padding: 16px 8px 10px; cursor: pointer;
  background: var(--card); border: 3px solid var(--ink); border-radius: 14px;
  box-shadow: 4px 4px 0 var(--ink);
  transition: transform .08s ease, box-shadow .08s ease;
  text-align: center;
}
.bid:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.bid:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
.bid .face { font-family: var(--f-display); font-size: 34px; line-height: 1; }
.bid .face.long { font-size: 24px; }
.bid .name { font-size: 13px; color: var(--muted); line-height: 1.3; }
.empty { color: var(--muted); }

/* hand finder */
.finder {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px);
  background: var(--card); border: 3px solid var(--ink); border-radius: 18px;
  box-shadow: 6px 6px 0 var(--ink); padding: 18px; display: grid; gap: 14px;
}
.finder h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.modes { display: flex; gap: 8px; flex-wrap: wrap; }
.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
.field label { font-family: var(--f-display); font-size: 17px; }
.step { display: flex; align-items: center; gap: 6px; }
.step button {
  width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid var(--ink);
  background: var(--paper); cursor: pointer; font-family: var(--f-display); font-size: 18px; line-height: 1;
  box-shadow: 2px 2px 0 var(--ink);
}
.step button:active { transform: translate(2px, 2px); box-shadow: none; }
.step input {
  width: 48px; text-align: center; font-family: var(--f-display); font-size: 20px;
  border: 0; border-bottom: 2.5px solid var(--ink); background: none; color: var(--ink);
  font-variant-numeric: tabular-nums; -moz-appearance: textfield;
}
.step input::-webkit-inner-spin-button, .step input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.sum { font-size: 13px; color: var(--muted); margin: 0; }
.sum.warn { color: var(--red); }
.answer {
  background: var(--hl-soft); border: 2.5px dashed var(--ink); border-radius: 14px;
  padding: 14px; display: grid; gap: 6px;
}
.answer .call { font-family: var(--f-display); font-size: 36px; line-height: 1.1; }
.answer p { margin: 0; }
.answer .go {
  justify-self: start; margin-top: 4px; border: 2.5px solid var(--ink); background: var(--hl); color: var(--on-hl);
  border-radius: 999px; padding: 3px 14px; cursor: pointer; font-family: var(--f-display);
  box-shadow: 2px 2px 0 var(--ink);
}

/* detail dialog */
dialog {
  width: min(720px, calc(100% - 32px)); max-height: calc(100% - 48px); padding: 0;
  border: 3px solid var(--ink); border-radius: 20px; background: var(--card); color: var(--ink);
  box-shadow: 8px 8px 0 var(--ink);
}
dialog::backdrop { background: rgba(20, 26, 60, .45); }
.dlg { padding: 22px 22px 24px; display: grid; gap: 16px; }
.dlg-head { display: flex; align-items: flex-start; gap: 12px; }
.dlg-t { flex: 1; min-width: 0; display: grid; gap: 4px; justify-items: start; }
.dlg-t h3 { word-break: keep-all; }
.dlg-t .seg { margin-top: 2px; }
.dlg-t .seg .pill { font-size: 13px; padding: 1px 10px; box-shadow: 2px 2px 0 var(--ink); }
.when .ex { display: block; margin-top: 8px; font-size: 18px; }
.when .ex small { font-size: 13px; }
.dlg-head .face {
  font-family: var(--f-display); font-size: 26px; min-width: 64px; text-align: center; white-space: nowrap;
  border: 3px solid var(--ink); border-radius: 12px; padding: 4px 10px; box-shadow: 3px 3px 0 var(--ink);
}
.dlg-head h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.2; flex: 1; min-width: 0; }
.dlg-head .cat { display: block; font-family: var(--f-body); font-size: 13px; color: var(--muted); }
.close {
  width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper);
  cursor: pointer; font-family: var(--f-display); font-size: 20px; flex: none; box-shadow: 2px 2px 0 var(--ink);
}
.when { margin: 0; background: var(--hl-soft); border: 2.5px solid var(--ink); border-radius: 12px; padding: 12px 14px; }
.when b { font-family: var(--f-display); font-weight: 400; margin-right: 6px; }
.auction { margin: 0; font-family: var(--f-display); font-size: 20px; }
.auction small { font-family: var(--f-body); font-size: 13px; color: var(--muted); margin-right: 8px; }
.auction mark { background: var(--hl); color: var(--on-hl); border-radius: 6px; padding: 0 6px; }
.auction mark .r { color: #c22a31; }
.tbl-title { margin: 0; font-family: var(--f-display); font-size: 17px; }
.tbl { overflow-x: auto; border: 2.5px solid var(--ink); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 460px; }
th, td { padding: 9px 12px; text-align: left; vertical-align: middle; }
thead th { font-family: var(--f-display); font-weight: 400; font-size: 14px; background: var(--ink); color: var(--paper); }
tbody tr:nth-child(even) td { background: var(--row); }
tbody tr.sec td { background: var(--hl-soft); font-family: var(--f-display); font-size: 14px; padding: 5px 12px; }
td.pts { white-space: nowrap; font-variant-numeric: tabular-nums; font-family: var(--f-display); }
td.call { white-space: nowrap; }
.chip {
  display: inline-block; font-family: var(--f-display); font-size: 17px; min-width: 52px; text-align: center;
  border: 2px solid var(--ink); border-radius: 8px; padding: 0 8px; background: var(--card);
}
td.cond { font-family: var(--f-display); font-size: 17px; line-height: 1.35; color: var(--ink); }
td.cond .s { font-size: 1.1em; }
td.note { color: var(--muted); font-size: 13px; }
.check { margin: 0; font-size: 13px; color: var(--muted); }
.rel { display: grid; gap: 10px; border-top: 2.5px dashed var(--muted); padding-top: 14px; }
.rel-list { display: flex; flex-wrap: wrap; gap: 8px; }
.rel-btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  border: 2.5px solid var(--ink); background: var(--paper); border-radius: 999px;
  padding: 4px 14px 4px 6px; font-size: 14px; box-shadow: 2px 2px 0 var(--ink);
}
.rel-btn .rf {
  font-family: var(--f-display); font-size: 14px; background: var(--card);
  border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; white-space: nowrap;
}
.rel-btn:hover { background: var(--hl-soft); }
.rel-btn:active { transform: translate(2px, 2px); box-shadow: none; }

.bar { display: grid; gap: 12px; }
.search-row { display: flex; align-items: center; gap: 10px; }
.search-row .search { flex: 1; min-width: 0; }
.filters { display: grid; gap: 12px; }
.filter-btn { display: none; flex: none; align-items: center; gap: 4px; }
.filter-btn.on { background: var(--hl); color: var(--on-hl); }
.filter-btn .caret { font-size: 12px; transition: transform .15s ease; }
.bar.open .filter-btn .caret { transform: rotate(180deg); }
.sysbox {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
  border: 2.5px dashed var(--ink); border-radius: 12px; padding: 8px 12px; font-size: 14px;
}
.sysbox b { font-family: var(--f-display); font-weight: 400; }
.seg { display: flex; gap: 6px; }
.seg .pill { font-size: 14px; padding: 2px 12px; }
.foot { margin: 0; font-size: 13px; color: var(--muted); }

@media (max-width: 860px) {
  .tabs { display: flex; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .finder { position: static; }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--paper);
  }
  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--paper); padding-block: 10px; gap: 10px;
    border-bottom: 2.5px solid var(--ink);
  }
  .bar .pills { flex-wrap: nowrap; overflow-x: auto; padding: 2px 4px 6px 2px; scrollbar-width: none; }
  .bar .pills::-webkit-scrollbar { display: none; }
  .bar .pill { flex: none; }
  .search { box-shadow: 3px 3px 0 var(--ink); padding: 6px 16px; }
  .filter-btn { display: inline-flex; padding: 8px 14px; }
  .filters { display: none; }
  .bar.open .filters { display: grid; gap: 10px; }
  body[data-tab="finder"] .bar .search-row, body[data-tab="finder"] .bar .filters { display: none; }
  body[data-tab="cards"] .finder { display: none; }
  body[data-tab="finder"] .cards-area { display: none; }
}
/* 휴대폰: 표 한 줄을 작은 카드 하나로. 비드가 맨 위에 크게 */
@media (max-width: 600px) {
  .dlg { padding: 18px 16px 20px; gap: 14px; }
  .dlg-head .face { font-size: 20px; min-width: 52px; padding: 3px 8px; }
  .dlg-head h3 { font-size: 21px; }
  .close { width: 36px; height: 36px; font-size: 18px; }
  .tbl { border: 0; border-radius: 0; overflow: visible; }
  .tbl table, .tbl tbody, .tbl tr, .tbl td { display: block; }
  .tbl table { min-width: 0; }
  .tbl thead { display: none; }
  .tbl tbody { display: grid; gap: 10px; }
  .tbl tbody tr {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px;
    background: var(--card); border: 2.5px solid var(--ink); border-radius: 12px;
    box-shadow: 3px 3px 0 var(--ink); padding: 10px 12px;
  }
  .tbl tbody tr td, .tbl tbody tr:nth-child(even) td { background: none; padding: 0; }
  .tbl td:empty { display: none; }
  .tbl td.call { order: -1; flex-basis: 100%; margin-bottom: 2px; white-space: normal; }
  .tbl td.call .chip { font-size: 20px; padding: 1px 10px; }
  .tbl td.pts, .tbl td.cond { font-size: 16px; }
  .tbl table:not(.lab) td.pts:not(:empty) + td.cond:not(:empty)::before { content: "· "; color: var(--muted); }
  .tbl table.lab td.pts:not(:empty)::before, .tbl table.lab td.cond:not(:empty)::before {
    content: attr(data-l) " "; font-family: var(--f-body); font-size: 12px; color: var(--muted);
  }
  .tbl td.note { flex-basis: 100%; }
  .tbl tbody tr.sec {
    display: block; background: none; border: 0; box-shadow: none; padding: 6px 2px 0;
  }
  .tbl tbody tr.sec td { background: none; padding: 0; font-size: 15px; color: var(--ink); }
}
@media (max-width: 420px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .bid, .pill, .step button { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="title-row"><h1>톡톡 <span class="hl">비딩</span></h1><span class="stamp">yoon의 비딩 노트</span></div>
    <p class="sub">헷갈릴 때 바로 누르는 비딩 카드. SAYC 기준이고, 시스템 버튼으로 2/1 GF 기준으로 바꿔 볼 수 있어요.</p>
  </header>
  <div class="bar" id="bar">
    <div class="search-row">
      <label class="search" for="q">
        <span aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="NMF, 스테이맨, Lebensohl, Drury…" autocomplete="off">
      </label>
      <button class="pill filter-btn" id="filter-btn" aria-expanded="false" aria-controls="filters">필터<span id="filter-count"></span> <span class="caret" aria-hidden="true">▾</span></button>
    </div>
    <div class="filters" id="filters">
      <div class="pills" id="cats" role="group" aria-label="분류"></div>
      <div class="pills" id="tiers" role="group" aria-label="자주 쓰는 정도"><span class="lab">보기</span></div>
      <div class="pills" id="sys" role="group" aria-label="비딩 시스템"><span class="lab">시스템</span></div>
    </div>
    <div class="tabs" role="group" aria-label="화면">
      <button class="pill" id="tab-cards" aria-pressed="true">비딩 카드</button>
      <button class="pill" id="tab-finder" aria-pressed="false">내 핸드로 찾기</button>
    </div>
  </div>

  <div class="layout">
    <main class="cards-area" id="cards"></main>

    <aside class="finder" aria-label="내 핸드로 찾기">
      <h2>내 핸드로 찾기</h2>
      <div class="modes" role="group" aria-label="상황">
        <button class="pill" id="mode-open" aria-pressed="true">내가 오프닝</button>
        <button class="pill" id="mode-1nt" aria-pressed="false">파트너 1NT 후</button>
      </div>
      <div class="field"><label for="hcp">점수 (HCP)</label><div class="step"><button data-t="hcp" data-d="-1" aria-label="점수 줄이기">−</button><input id="hcp" type="number" min="0" max="37" value="13"><button data-t="hcp" data-d="1" aria-label="점수 늘리기">+</button></div></div>
      <div class="field"><label for="ls"><span class="s">♠</span> 장수</label><div class="step"><button data-t="ls" data-d="-1" aria-label="스페이드 줄이기">−</button><input id="ls" type="number" min="0" max="13" value="3"><button data-t="ls" data-d="1" aria-label="스페이드 늘리기">+</button></div></div>
      <div class="field"><label for="lh"><span class="s r">♥</span> 장수</label><div class="step"><button data-t="lh" data-d="-1" aria-label="하트 줄이기">−</button><input id="lh" type="number" min="0" max="13" value="5"><button data-t="lh" data-d="1" aria-label="하트 늘리기">+</button></div></div>
      <div class="field"><label for="ld"><span class="s r">♦</span> 장수</label><div class="step"><button data-t="ld" data-d="-1" aria-label="다이아몬드 줄이기">−</button><input id="ld" type="number" min="0" max="13" value="3"><button data-t="ld" data-d="1" aria-label="다이아몬드 늘리기">+</button></div></div>
      <div class="field"><label for="lc"><span class="s">♣</span> 장수</label><div class="step"><button data-t="lc" data-d="-1" aria-label="클럽 줄이기">−</button><input id="lc" type="number" min="0" max="13" value="2"><button data-t="lc" data-d="1" aria-label="클럽 늘리기">+</button></div></div>
      <p class="sum" id="sum"></p>
      <div class="answer" id="answer" aria-live="polite"></div>
    </aside>
  </div>

  <p class="foot">일반적인 SAYC 기준이에요. 선택 컨벤션은 방식이 여러 가지라 대표 형태로 적었어요. 파트너와 정한 약속이 다르면 약속을 따르세요.</p>
  <p class="sign">made by yoon</p>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg" id="dlg-body"></div></dialog>

<script>

// 이어서 볼 카드
const NTDEF = ["dont", "capp", "landy", "mlandy", "meckwell", "brozel", "woolsey"];
const REL = {
  "1nt": ["stayman", "jacoby", "texas", "mintr", "quant", "gerber"], "1major": ["j2nt", "splinter", "bergen", "1ntf", "2over1", "drury"],
  "1minor": ["inverted", "nmf", "twalsh"], "2c": ["secneg", "kokish"], weak2: ["ogust"], "2nt": ["puppet", "muppet", "gerber"],

  stayman: ["smolen", "garbage", "crawling", "puppet"], jacoby: ["texas", "smolen"], texas: ["rkcb"], smolen: ["stayman", "jacoby"],
  garbage: ["crawling"], crawling: ["garbage"], mintr: ["minstay"], minstay: ["mintr"], puppet: ["muppet", "stayman"], muppet: ["puppet"],

  overcall: ["wjo", "1ntoc", "transadv"], tox: ["responsive", "elc", "scramble", "redbl"], "1ntoc": ["stayman", "jacoby", "balance"],

  vspre: ["lebensohl", "leaping", "nonleap"], leaping: ["nonleap", "michaels"], nonleap: ["leaping"], vs2c: ["2c"], vsmulti: ["multi"],

  sos: ["runout", "redbl"], sac: ["lott"], fitjump: ["mixed"], mixed: ["fitjump"], maximal: ["helpsuit"], nfb: ["negx"], goodbad: ["lott"],

  rkcb: ["bw", "minorwood", "kickback", "exclusion", "dopi", "gsf"], bw: ["rkcb", "gerber"], quant: ["q5nt", "1nt"], cue: ["serious", "lasttrain", "splinter"],
  gerber: ["bw", "quant"], serious: ["cue", "lasttrain"], lasttrain: ["cue"], gsf: ["q5nt", "rkcb"], q5nt: ["gsf", "quant"],
  lightner: ["leadx", "penx"], leadx: ["lightner"], minorwood: ["kickback", "rkcb"], kickback: ["minorwood", "rkcb"], exclusion: ["rkcb"], dopi: ["rkcb"],
  points: ["rules", "ltc"], rules: ["seat34", "ltc"], ltc: ["points"], qt: ["2c"]

NTDEF.forEach(id => { REL[id] = NTDEF.filter(x => x !== id); });

const parseRow = s => s.startsWith("#") ? { sec: s.slice(1) } : s.split("|");
const suit = s => (s || "").replace(/[♥♦]/g, m => `<span class="r s">${m}</span>`).replace(/[♠♣]/g, m => `<span class="s">${m}</span>`);
const byId = Object.fromEntries(C.map(c => [c.id, c]));
let cat = "all", tierMode = "all";

function pillGroup(boxId, items, current, onPick) {
  const box = document.getElementById(boxId);
  items.forEach(([k, label]) => {
    const b = document.createElement("button");
    b.className = "pill"; b.textContent = label; b.dataset.k = k;
    b.setAttribute("aria-pressed", k === current ? "true" : "false");
    b.onclick = () => { box.querySelectorAll(".pill").forEach(p => p.setAttribute("aria-pressed", p.dataset.k === k)); onPick(k); };
    box.appendChild(b);
  });
}
pillGroup("cats", [["all", "전체"], ...CATS, ["dbl", "더블 · 리더블"]], "all", k => { cat = k; renderCards(); });
let sys = "sayc";
try { const v = localStorage.getItem("bb-sys"); if (v === "gf" || v === "sayc") sys = v; } catch (e) {}
const SYS_NAME = { sayc: "SAYC", gf: "2/1 GF" };
pillGroup("sys", [["sayc", "SAYC"], ["gf", "2/1 GF"]], sys, k => setSys(k));
function setSys(k) {
  sys = k;
  try { localStorage.setItem("bb-sys", k); } catch (e) {}
  document.querySelectorAll("#sys .pill").forEach(p => p.setAttribute("aria-pressed", p.dataset.k === k));
  updateFilterCount();
  const id = location.hash.slice(1);
  if (dlg.open && byId[id]) openCard(id);
}
const isDbl = c => c.x || /^X{1,2}$/.test(c.face);
pillGroup("tiers", [["all", "모두"], ["t1", "자주 쓰는 것만"], ["no3", "심화 빼고"]], "all", k => { tierMode = k; renderCards(); });

function visible(c, q) {
  if (tierMode === "t1" && c.t !== 1) return false;
  if (tierMode === "no3" && c.t === 3) return false;
  return !q || (c.face + " " + c.name + " " + c.id + " " + (EN[c.id] || "") + " " + c.when).toLowerCase().includes(q);
}
const TIER_NOTE = {
  1: "게임에서 거의 매번 만나는 비딩",
  2: "많은 파트너십이 쓰거나, 상대가 쓰면 알아야 하는 것",
  3: "방식이 여러 가지라 파트너와 정해서 쓰는 것"
};
function cardHtml(c) {
  const long = c.face.replace(/\s/g, "").length > 3;
  return `<button class="bid" data-id="${c.id}"><span class="face${long ? " long" : ""}">${suit(c.face)}</span><span class="name">${c.name}</span></button>`;
}
function renderCards() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const box = document.getElementById("cards");
  let html = "";
  [1, 2, 3].forEach(t => {
    let groups = "";
    CATS.forEach(([k, label]) => {
      if (cat !== "all" && cat !== "dbl" && cat !== k) return;
      const list = C.filter(c => c.t === t && c.cat === k && visible(c, q) && (cat !== "dbl" || isDbl(c)));
      if (!list.length) return;
      groups += `<section class="group"><h3>${label}<small>${list.length}장</small></h3><div class="grid">${list.map(cardHtml).join("")}</div></section>`;
    });
    if (groups) html += `<section class="tier-sec"><div class="tier-head"><h2>${t === 1 ? `<span class="hl">${TIERS[t]}</span>` : TIERS[t]}</h2><p>${TIER_NOTE[t]}</p></div>${groups}</section>`;
  });
  box.innerHTML = html || `<p class="empty">“${q.replace(/[<>&"]/g, "")}”에 맞는 카드가 없어요. 다른 이름으로 찾아보거나 보기를 ‘모두’로 바꿔보세요.</p>`;
  box.querySelectorAll(".bid").forEach(b => b.onclick = () => { location.hash = b.dataset.id; });
  updateFilterCount();
}
/* 휴대폰 필터 접기 */
function updateFilterCount() {
  const n = (cat !== "all") + (tierMode !== "all") + (sys !== "sayc");
  const btn = document.getElementById("filter-btn");
  document.getElementById("filter-count").textContent = n ? ` · ${n}` : "";
  btn.classList.toggle("on", n > 0);
}
document.getElementById("filter-btn").onclick = () => {
  const bar = document.getElementById("bar");
  const open = bar.classList.toggle("open");
  document.getElementById("filter-btn").setAttribute("aria-expanded", open);
}
document.getElementById("q").addEventListener("input", renderCards);

const dlg = document.getElementById("dlg");
function openCard(id) {
  const base = byId[id]; if (!base) return;
  const c = base.sys && base.sys[sys] ? { ...base, ...base.sys[sys] } : base;
  const cols = (c.cols || COLS).split("|");
  const catLabel = CATS.find(x => x[0] === c.cat)[1];
  const auction = suit(c.auc).replace(/\[\[(.+?)\]\]/, "<mark>$1</mark>");
  const body = c.rows.map(parseRow).map(r => r.sec
    ? `<tr class="sec"><td colspan="4">${suit(r.sec)}</td></tr>`
    : `<tr><td class="pts" data-l="${cols[0]}">${suit(r[0])}</td><td class="cond" data-l="${cols[1]}">${suit(r[1])}</td><td class="call">${r[2] ? `<span class="chip">${suit(r[2])}</span>` : ""}</td><td class="note">${suit(r[3])}</td></tr>`).join("");
  document.getElementById("dlg-body").innerHTML = `
    <div class="dlg-head">
      <span class="face">${suit(c.face)}</span>
      <div class="dlg-t">
        <h3 id="dlg-title">${c.name}</h3>
        <span class="cat">${catLabel} · ${TIERS[c.t]}</span>
        ${base.sys ? `<div class="seg" role="group" aria-label="시스템에 따라 달라요">${["sayc", "gf"].map(k => `<button class="pill" data-sys="${k}" aria-pressed="${k === sys}">${SYS_NAME[k]}</button>`).join("")}</div>` : ""}
      </div>
      <button class="close" aria-label="닫기">✕</button>
    </div>
    <p class="when"><b>언제 쓰나</b>${suit(c.when)}<span class="auction ex"><small>예시</small>${auction}</span></p>
    <p class="tbl-title">${suit(c.title)}</p>
    <div class="tbl"><table class="${c.cols ? "lab" : ""}">
      <thead><tr>${cols.map(h => `<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${body}</tbody>
    </table></div>
    ${c.chk ? `<p class="check">방식이 여러 가지인 컨벤션이에요. 대표 형태로 적었으니 파트너와 약속을 꼭 확인하세요.</p>` : ""}
    ${(REL[id] || []).filter(r => byId[r]).length ? `<div class="rel"><p class="tbl-title">이어서 볼 카드</p><div class="rel-list">${REL[id].filter(r => byId[r]).map(r => `<button class="rel-btn" data-id="${r}"><span class="rf">${suit(byId[r].face)}</span>${byId[r].name}</button>`).join("")}</div></div>` : ""}`;
  dlg.querySelectorAll("[data-sys]").forEach(b => b.onclick = () => setSys(b.dataset.sys));
  dlg.querySelectorAll(".rel-btn").forEach(b => b.onclick = () => { location.hash = b.dataset.id; });
  dlg.querySelector(".close").onclick = closeCard;
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
}
function closeCard() { if (location.hash) location.hash = ""; if (dlg.open) dlg.close(); }
dlg.addEventListener("click", e => { if (e.target === dlg) closeCard(); });
dlg.addEventListener("cancel", e => { e.preventDefault(); closeCard(); });
function route() {
  const id = location.hash.slice(1);
  if (byId[id]) openCard(id); else if (dlg.open) dlg.close();
}
window.addEventListener("hashchange", route);

/* phone tabs */
function setTab(t) {
  document.body.dataset.tab = t;
  document.getElementById("tab-cards").setAttribute("aria-pressed", t === "cards");
  document.getElementById("tab-finder").setAttribute("aria-pressed", t === "finder");
}
document.getElementById("tab-cards").onclick = () => setTab("cards");
document.getElementById("tab-finder").onclick = () => setTab("finder");
setTab("cards");

/* hand finder */
let mode = "open";
const ids = ["hcp", "ls", "lh", "ld", "lc"];
const val = id => { const v = parseInt(document.getElementById(id).value, 10); return isNaN(v) ? 0 : v; };
document.querySelectorAll(".step button").forEach(b => b.onclick = () => {
  const el = document.getElementById(b.dataset.t);
  el.value = Math.max(+el.min, Math.min(+el.max, val(b.dataset.t) + +b.dataset.d));
  solve();
});
ids.forEach(id => document.getElementById(id).addEventListener("input", solve));
function setMode(m) {
  mode = m;
  document.getElementById("mode-open").setAttribute("aria-pressed", m === "open");
  document.getElementById("mode-1nt").setAttribute("aria-pressed", m === "1nt");
  solve();
}
document.getElementById("mode-open").onclick = () => setMode("open");
document.getElementById("mode-1nt").onclick = () => setMode("1nt");

function isBalanced(L) {
  const k = [...L].sort((a, b) => b - a).join("");
  return k === "4333" || k === "4432" || k === "5332";
}
function openingCall(h, S, H, D, Cl) {
  const L = [S, H, D, Cl], bal = isBalanced(L);
  const two = [...L].sort((a, b) => b - a);
  const r20 = h + two[0] + two[1] >= 20;
  if (bal && h >= 20 && h <= 21) return ["2NT", "20–21점 밸런스", "2nt"];
  if (bal && h >= 24 && h <= 25) return ["3NT", "24–25점 밸런스 → 3NT 오픈", "2nt"];
  if (h >= 22 || (!bal && h >= 21)) return ["2♣", bal ? (h <= 23 ? "22–23점 밸런스 → 2♣ 후 2NT" : h <= 27 ? "26–27점 밸런스 → 2♣ 후 3NT" : "28점 이상 밸런스 → 2♣ 후 4NT") : `${h}점 언밸런스 → 강한 2♣ (트릭 수도 확인)`, "2c"];
  if (bal && h >= 15 && h <= 17) return ["1NT", "15–17점 밸런스" + (S === 5 || H === 5 ? " (5장 메이저가 있어도 1NT 가능)" : ""), "1nt"];
  if (h >= 12 || (h === 11 && r20)) {
    const why = h >= 12 ? `${h}점, 오프닝 가능` : "11점이지만 Rule of 20 충족";
    if (S >= 5 && S >= H) return ["1♠", `${why}, ♠ ${S}장`, "1major"];
    if (H >= 5) return ["1♥", `${why}, ♥ ${H}장`, "1major"];
    if (D > Cl || (D === Cl && D >= 4)) return ["1♦", `${why}, 5장 메이저 없음, ♦가 더 길거나 4-4`, "1minor"];
    return ["1♣", `${why}, 5장 메이저 없음` + (D === Cl ? ", 3-3은 1♣" : ""), "1minor"];
  }
  if (h >= 4 && h <= 9) {
    const names = ["♠", "♥", "♦", "♣"];
    const i = L.findIndex(x => x >= 7);
    if (i >= 0) return [`${L[i] >= 8 ? 4 : 3}${names[i]}`, `${h}점, ${names[i]} ${L[i]}장 Preempt`, "pre3"];
  }
  if (h >= 5 && h <= 10) {
    if (S === 6) return ["2♠", `${h}점, ♠ 6장 위크 투`, "weak2"];
    if (H === 6) return ["2♥", `${h}점, ♥ 6장 위크 투`, "weak2"];
    if (D === 6) return ["2♦", `${h}점, ♦ 6장 위크 투`, "weak2"];
  }
  return ["패스", h < 12 ? `${h}점은 오프닝하기에 부족해요` : "맞는 오프닝이 없어요", h === 11 || h === 10 ? "rules" : null];
}
function after1NT(h, S, H, D, Cl) {
  if ((S >= 6 || H >= 6) && h >= 10 && h <= 15)
    return [S >= H ? "4♥" : "4♦", `6장 메이저, 게임 점수 → 텍사스 (${S >= H ? "♠" : "♥"}로 이동)`, "texas"];
  if ((S === 5 && H === 4 || H === 5 && S === 4) && h >= 10)
    return ["2♣", `5-4 메이저, 게임 점수 → 스테이맨 후 2♦가 나오면 스몰렌`, "smolen"];
  if (S >= 5 || H >= 5) {
    const sp = S >= H;
    const call = sp ? "2♥" : "2♦";
    const next = h <= 7 ? "완성되면 패스" : h <= 9 ? "다음에 2NT 또는 3레벨로 초대" : "다음에 3NT 또는 4레벨";
    return [call, `${sp ? "♠" : "♥"} ${sp ? S : H}장 → 제이코비 트랜스퍼. ${next}`, "jacoby"];
  }
  if ((S === 4 || H === 4) && h >= 8) return ["2♣", "8점 이상, 4장 메이저 → 스테이맨", "stayman"];
  if (S === 4 && H === 4 && Cl <= 1 && h <= 7) return ["2♣", "약하지만 4-4 메이저, ♣ 짧음 → 가비지 스테이맨", "garbage"];
  if (h <= 7) return ["패스", "0–7점, 게임 가능성이 없어요", "1nt"];
  if (h <= 9) return ["2NT", "8–9점, 게임 초대", "1nt"];
  if (h <= 15) return ["3NT", "10–15점, 게임", "1nt"];
  if (h <= 17) return ["4NT", "16–17점, 6NT 초대 (Quantitative)", "quant"];
  if (h <= 19) return ["6NT", "18–19점, 스몰 슬램", "1nt"];
  return ["4♣ → 7NT", "20점 이상, 거버로 에이스를 확인하고 그랜드 슬램", "gerber"];
}
function solve() {
  const h = val("hcp"), S = val("ls"), H = val("lh"), D = val("ld"), Cl = val("lc");
  const total = S + H + D + Cl;
  const sum = document.getElementById("sum");
  sum.textContent = total === 13 ? "장수 합 13장 ✓" : `장수 합이 ${total}장이에요. 13장이 되게 맞춰주세요.`;
  sum.className = "sum" + (total === 13 ? "" : " warn");
  const [call, why, link] = mode === "open" ? openingCall(h, S, H, D, Cl) : after1NT(h, S, H, D, Cl);
  const box = document.getElementById("answer");
  box.innerHTML = `<span class="call">${suit(call)}</span><p>${suit(why)}</p>` +
    (link ? `<button class="go" data-id="${link}">${byId[link].name} 카드 보기</button>` : "");
  const go = box.querySelector(".go");
  if (go) go.onclick = () => { location.hash = go.dataset.id; };
}

renderCards();
solve();
route();
